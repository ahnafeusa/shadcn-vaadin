name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B --no-transfer-progress verify -Pdirectory
      - uses: actions/upload-artifact@v4
        with:
          name: shadcn-vaadin
          path: target/*.zip
