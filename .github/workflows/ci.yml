name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Regenerate the screenshot baselines and upload them as an artifact
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B --no-transfer-progress verify -Pdirectory
      - uses: actions/upload-artifact@v4
        with:
          name: shadcn-vaadin
          path: target/*.zip

  screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: screenshot-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: screenshot-tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test ${{ inputs.update-snapshots == true && '--update-snapshots' || '' }}
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.update-snapshots == true }}
        with:
          name: screenshot-baselines
          path: screenshot-tests/tests/**/*-snapshots/*-linux.png
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: screenshot-tests/playwright-report
